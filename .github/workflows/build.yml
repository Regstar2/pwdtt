name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  go-root:
    name: Go root tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev


      - name: Test root module
        run: go test -count=1 ./...

      - name: Verify WebView2 override
        run: test "$(go list -m -f '{{.Version}}' github.com/wailsapp/go-webview2)" = "v1.0.23"

      - name: Verify Edge CDP dependency
        run: test "$(go list -m -f '{{.Version}}' github.com/gorilla/websocket)" = "v1.5.3"

  core-race:
    name: Core race tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify core modules
        working-directory: core
        run: go mod verify

      - name: Test core with race detector
        working-directory: core
        run: go test -race -count=1 ./...

  windows-backend:
    name: Windows backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'


      - name: Test Windows backend
        run: go test -count=1 ./backend

  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-linux-windows:
    name: Build Linux and Windows
    needs: [go-root, core-race, windows-backend, frontend]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        shell: bash
        run: |
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PWDTT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Verify Windows GUI stays asInvoker
        run: grep -Fq '<requestedExecutionLevel level="asInvoker" uiAccess="false"/>' build/windows/wails.exe.manifest

      - name: Build Linux
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-linux-amd64

      - name: Build Windows
        run: wails build -platform windows/amd64 -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-windows-amd64.exe

      - name: Upload Linux artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: build/bin/pwdtt-linux-amd64

      - name: Upload Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-windows-amd64
          path: build/bin/pwdtt-windows-amd64.exe

  build-macos:
    name: Build macOS
    needs: [go-root, core-race, windows-backend, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        shell: bash
        run: |
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PWDTT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build macOS
        run: wails build -platform darwin/universal -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-macos

      - name: Zip macOS app
        if: github.event_name != 'pull_request'
        run: cd build/bin && zip -r PWDTT-macos.zip PWDTT.app

      - name: Upload macOS artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-macos
          path: build/bin/PWDTT-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-windows-amd64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-macos
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/pwdtt-linux-amd64
            dist/pwdtt-windows-amd64.exe
            dist/PWDTT-macos.zip
