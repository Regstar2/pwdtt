name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-linux-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        shell: bash
        run: |
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PWDTT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev pkg-config gcc libgtk-3-dev webkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Test backend
        run: go test ./backend

      - name: Test core with race detector
        working-directory: core
        run: go test -race ./...

      - name: Verify WebView2 override
        run: test "$(go list -m -f '{{.Version}}' github.com/wailsapp/go-webview2)" = "v1.0.23"

      - name: Verify Edge CDP dependency
        run: test "$(go list -m -f '{{.Version}}' github.com/gorilla/websocket)" = "v1.5.3"

      - name: Compile Windows backend tests
        run: GOOS=windows GOARCH=amd64 go test -c ./backend -o /tmp/pwdtt-backend-windows.test.exe

      - name: Verify Windows GUI stays asInvoker
        run: grep -Fq '<requestedExecutionLevel level="asInvoker" uiAccess="false"/>' build/windows/wails.exe.manifest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build Linux
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-linux-amd64

      - name: Build Windows
        run: wails build -platform windows/amd64 -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-windows-amd64.exe

      - name: Upload Linux artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: build/bin/pwdtt-linux-amd64

      - name: Upload Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-windows-amd64
          path: build/bin/pwdtt-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        shell: bash
        run: |
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PWDTT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS
        run: wails build -platform darwin/universal -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-macos

      - name: Zip macOS app
        if: github.event_name != 'pull_request'
        run: cd build/bin && zip -r PWDTT-macos.zip PWDTT.app

      - name: Upload macOS artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-macos
          path: build/bin/PWDTT-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-windows-amd64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-macos
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/pwdtt-linux-amd64
            dist/pwdtt-windows-amd64.exe
            dist/PWDTT-macos.zip
