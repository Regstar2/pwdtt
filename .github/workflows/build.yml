name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  go-root:
    name: Go root tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev


      - name: Prepare embedded frontend assets
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>ci</title>\n' > frontend/dist/index.html

      - name: Test root module
        run: go test -count=1 ./...

      - name: Verify WebView2 override
        run: test "$(go list -m -f '{{.Version}}' github.com/wailsapp/go-webview2)" = "v1.0.23"

      - name: Verify Edge CDP dependency
        run: test "$(go list -m -f '{{.Version}}' github.com/gorilla/websocket)" = "v1.5.3"

  core-race:
    name: Core race tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify core modules
        working-directory: core
        run: go mod verify

      - name: Test core with race detector
        working-directory: core
        run: go test -race -count=1 ./...

  windows-backend:
    name: Windows backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'


      - name: Test Windows backend
        run: go test -count=1 ./backend

  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-scripts:
    name: Release helper smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test checksum and release-note generation
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'pwdtt-release-smoke'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          foreach ($name in @(
            'pwdtt-linux-amd64',
            'pwdtt-windows-amd64.exe',
            'pwdtt-windows-amd64-setup.exe',
            'PWDTT-macos.zip'
          )) {
            Set-Content -LiteralPath (Join-Path $dist $name) -Value "test-$name"
          }
          $status = Join-Path $dist 'windows-signing-status.txt'
          Set-Content -LiteralPath $status -Value 'Authenticode: unsigned CI smoke fixture'
          ./scripts/release.ps1 -Version 'v0.0.0-ci.1' -DistDir $dist -SigningStatusFile $status
          $checksums = @(Get-Content -LiteralPath (Join-Path $dist 'SHA256SUMS'))
          if ($checksums.Count -ne 4) {
            throw "Expected four payload checksums, got $($checksums.Count)"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dist 'RELEASE_NOTES.md'))) {
            throw 'RELEASE_NOTES.md was not generated'
          }
  build-linux-windows:
    name: Build Linux and Windows
    needs: [go-root, core-race, windows-backend, frontend, release-scripts]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        shell: bash
        run: |
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PWDTT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Verify Windows GUI stays asInvoker
        run: grep -Fq '<requestedExecutionLevel level="asInvoker" uiAccess="false"/>' build/windows/wails.exe.manifest

      - name: Build Linux
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-linux-amd64

      - name: Build Windows
        run: wails build -platform windows/amd64 -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-windows-amd64.exe

      - name: Upload Linux artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: build/bin/pwdtt-linux-amd64

      - name: Upload raw Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-windows-portable-raw
          path: build/bin/pwdtt-windows-amd64.exe
          retention-days: 2

  windows-package:
    name: Windows installer and signing
    needs: [build-linux-windows]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = 'dev'
          $versionInfo = '0.0.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?    name: Build macOS
    needs: [go-root, core-race, windows-backend, frontend, release-scripts]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        shell: bash
        run: |
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PWDTT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build macOS
        run: wails build -platform darwin/universal -ldflags "-X pwdtt/backend.Version=${PWDTT_VERSION}" -o pwdtt-macos

      - name: Zip macOS app
        if: github.event_name != 'pull_request'
        run: cd build/bin && zip -r PWDTT-macos.zip PWDTT.app

      - name: Upload macOS artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-macos
          path: build/bin/PWDTT-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.actor == github.repository_owner
    needs: [build-linux-windows, windows-package, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify exact tag source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: dist

      - name: Download final Windows package
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-windows-package
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-macos
          path: dist

      - name: Generate SHA-256 checksums and release notes
        shell: pwsh
        run: ./scripts/release.ps1 -Version $env:GITHUB_REF_NAME -DistDir 'dist' -SigningStatusFile 'dist/windows-signing-status.txt'

      - name: Verify final release payload
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            dist/pwdtt-linux-amd64 \
            dist/pwdtt-windows-amd64.exe \
            dist/pwdtt-windows-amd64-setup.exe \
            dist/PWDTT-macos.zip \
            dist/SHA256SUMS \
            dist/RELEASE_NOTES.md; do
            test -s "$file"
          done
          test "$(wc -l < dist/SHA256SUMS)" -eq 4
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            "${prerelease[@]}" \
            dist/pwdtt-linux-amd64 \
            dist/pwdtt-windows-amd64.exe \
            dist/pwdtt-windows-amd64-setup.exe \
            dist/PWDTT-macos.zip \
            dist/SHA256SUMS
